<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk to your metrics</title>
  <meta name="description" content="Ask Olist's e-commerce data in plain English. Answers come from a dbt semantic layer over MCP, with the definition and SQL behind every number.">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-left">
      <button type="button" class="icon-btn" id="back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <a href="/" class="brand" id="home">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M10 22V15M16 22V10M22 22V18"/></svg>
        <span>Talk to your metrics</span>
      </a>
    </div>
    <div class="top-right">
      <button type="button" class="icon-btn phone-only" id="open-panel" aria-label="Open query panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
      <button type="button" class="icon-btn" id="theme" aria-label="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="github" href="https://github.com/Abiramashree/talk-to-your-metrics">GitHub</a>
    </div>
  </header>

  <main class="welcome" id="welcome">
    <div class="welcome-text">
      <h1 class="slide s1">Ask Olist's data.<br>Get the governed number.</h1>
      <p class="slide s2">An AI agent answers through a dbt semantic layer over MCP. Every number comes with its definition and SQL, and every query can be edited by hand.</p>
      <a class="primary slide s3" href="/chat" id="try">Try it</a>
    </div>
    <figure class="demo slide s4" id="demo" data-src="" hidden>
      <img id="demo-img" alt="A question answered in the app: chart, table, and the editable query beside it">
    </figure>
  </main>

  <main class="app" id="chat-view" aria-label="Assistant" hidden>
    <div class="chat">
      <div class="thread" id="thread" aria-live="polite">
        <div class="empty" id="empty">
          <h2>What do you want to know?</h2>
          <div class="suggestions">
            <button type="button">Revenue by quarter in 2017</button>
            <button type="button">Top 5 product categories by revenue</button>
            <button type="button">Late delivery rate by state in 2018</button>
          </div>
        </div>
      </div>
      <form class="composer" id="composer">
        <input id="question" maxlength="300" autocomplete="off" placeholder="Ask about Olist orders" aria-label="Question">
        <button type="submit" aria-label="Ask">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>

    <aside class="panel" id="panel" aria-label="Query">
      <div class="panel-head">
        <h2>Query</h2>
        <div>
          <button type="button" class="small-btn" id="new-query">New</button>
          <button type="button" class="small-btn close" id="close-panel" aria-label="Close">×</button>
        </div>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </main>
</body>
</html>

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customers'), field: customer_id}
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}
  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('fct_orders'), field: order_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_products'), field: product_id}
  - name: fct_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('fct_orders'), field: order_id}
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

[project]
name = "talk-to-your-metrics"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "dbt-metricflow[dbt-duckdb]==0.16.0",
    "metricflow==0.214.0",
    "duckdb==2.0.0",
    "pyyaml>=6",
    "mcp==2.3.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

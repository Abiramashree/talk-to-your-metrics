# Questions that ask for a metric by a dimension at another level of detail (an order's product
# category, an order's payment type). Written after the benchmark, to check the app, not part of it.
# Correct answers are SQL on the raw tables; "decline" means no metric answers it honestly.

- id: c1
  question: How many canceled orders contained a health_beauty item?
  kinds: [count]
  sql: |
    select count(distinct i.order_id)
    from raw.order_items i
    join raw.orders o using (order_id)
    join raw.products p using (product_id)
    left join raw.product_category_name_translation t on t.product_category_name = p.product_category_name
    where o.order_status = 'canceled'
      and coalesce(t.product_category_name_english, p.product_category_name) = 'health_beauty'

- id: c2
  question: How many delivered orders placed in 2018 were paid by boleto?
  kinds: [count]
  sql: |
    select count(distinct o.order_id)
    from raw.orders o
    join raw.order_payments p using (order_id)
    where o.order_status = 'delivered' and p.payment_type = 'boleto'
      and o.order_purchase_timestamp >= '2018-01-01' and o.order_purchase_timestamp < '2019-01-01'

- id: c3
  question: Which product category had the most canceled orders?
  kinds: [key, count]
  top_row: true
  sql: |
    select coalesce(t.product_category_name_english, p.product_category_name) as category, count(distinct i.order_id) as n
    from raw.order_items i
    join raw.orders o using (order_id)
    join raw.products p using (product_id)
    left join raw.product_category_name_translation t on t.product_category_name = p.product_category_name
    where o.order_status = 'canceled'
    group by 1
    order by 2 desc
    limit 2

- id: c4
  question: How many orders used a voucher, by year?
  kinds: [key, count]
  sql: |
    select year(o.order_purchase_timestamp) as y, count(distinct o.order_id)
    from raw.orders o
    join raw.order_payments p using (order_id)
    where p.payment_type = 'voucher'
    group by 1
    order by 1

- id: c5
  question: How many orders placed in 2017 included something from computers_accessories?
  kinds: [count]
  sql: |
    select count(distinct i.order_id)
    from raw.order_items i
    join raw.orders o using (order_id)
    join raw.products p using (product_id)
    left join raw.product_category_name_translation t on t.product_category_name = p.product_category_name
    where coalesce(t.product_category_name_english, p.product_category_name) = 'computers_accessories'
      and o.order_purchase_timestamp >= '2017-01-01' and o.order_purchase_timestamp < '2018-01-01'


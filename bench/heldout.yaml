# Held-out questions for the harness comparison (C alone vs C + harness). Written after the benchmark,
# before any harness code and before any run on these questions. Never used to tune prompts, context or
# the harness, and never added to the verified-query library.
# `sql` is the correct answer against the raw tables, following definitions.md. `layer` is one semantic-layer
# query that should give the same rows; bench/check_heldout.py runs both, so every question is checked
# answerable (or not) before any model sees it. Nothing here is shown to the model.
# trap: what makes the question harder than the benchmark's.

- id: h01
  trap: relative-time
  question: What was revenue last quarter?
  kinds: [money]
  sql: |
    select sum(cast(i.price as decimal(18, 2))) from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered'
      and o.order_purchase_timestamp >= '2018-07-01' and o.order_purchase_timestamp < '2018-10-01'
  layer: {metrics: [revenue], start: '2018-07-01', end: '2018-09-30'}

- id: h02
  trap: relative-time
  question: What was the cancellation rate last year?
  kinds: [rate]
  sql: |
    select count(*) filter (where order_status = 'canceled') / count(*) from raw.orders
    where year(order_purchase_timestamp) = 2017
  layer: {metrics: [cancellation_rate], start: '2017-01-01', end: '2017-12-31'}

- id: h03
  trap: relative-time
  question: What was the late delivery rate in the first half of this year?
  kinds: [rate]
  sql: |
    select count(*) filter (where cast(order_delivered_customer_date as date) > cast(order_estimated_delivery_date as date)) / count(*)
    from raw.orders
    where order_status = 'delivered' and order_delivered_customer_date is not null
      and order_purchase_timestamp >= '2018-01-01' and order_purchase_timestamp < '2018-07-01'
  layer: {metrics: [late_delivery_rate], start: '2018-01-01', end: '2018-06-30'}

- id: h04
  trap: wording
  question: What were total sales in 2018?
  kinds: [money]
  sql: |
    select sum(cast(i.price as decimal(18, 2))) from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018
  layer: {metrics: [revenue], start: '2018-01-01', end: '2018-12-31'}

- id: h05
  trap: wording
  question: How much did customers spend per delivered order on average in 2018, excluding shipping?
  kinds: [money]
  sql: |
    select sum(cast(i.price as decimal(18, 2))) / count(distinct o.order_id)
    from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018
  layer: {metrics: [average_order_value], start: '2018-01-01', end: '2018-12-31'}

- id: h06
  trap: wording
  question: Show GMV by quarter for 2017.
  kinds: [key, money]
  sql: |
    select date_trunc('quarter', o.order_purchase_timestamp),
           sum(cast(i.price as decimal(18, 2)) + cast(i.freight_value as decimal(18, 2)))
    from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2017
    group by 1 order by 1
  layer: {metrics: [gross_merchandise_value], group_by: [metric_time__quarter], start: '2017-01-01', end: '2017-12-31'}

- id: h07
  trap: two-groupings
  question: Show revenue for SP and RJ in 2017 and 2018, by state and year.
  kinds: [key, key, money]
  sql: |
    select c.customer_state, year(o.order_purchase_timestamp), sum(cast(i.price as decimal(18, 2)))
    from raw.order_items i join raw.orders o using (order_id) join raw.customers c using (customer_id)
    where o.order_status = 'delivered' and c.customer_state in ('SP', 'RJ')
      and year(o.order_purchase_timestamp) in (2017, 2018)
    group by 1, 2 order by 1, 2
  layer: {metrics: [revenue], group_by: [order__state, metric_time__year],
          filters: [{dimension: order__state, operator: in, value: [SP, RJ]}], start: '2017-01-01', end: '2018-12-31'}

- id: h08
  trap: level-of-detail
  question: How many delivered orders placed in 2018 included a bed_bath_table item?
  kinds: [count]
  sql: |
    select count(distinct i.order_id)
    from raw.order_items i join raw.orders o using (order_id) join raw.products p using (product_id)
    left join raw.product_category_name_translation t on t.product_category_name = p.product_category_name
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018
      and coalesce(t.product_category_name_english, p.product_category_name) = 'bed_bath_table'
  layer: {metrics: [orders_by_category], start: '2018-01-01', end: '2018-12-31',
          filters: [{dimension: product__category, operator: '=', value: bed_bath_table},
                    {dimension: order__status, operator: '=', value: delivered}]}

- id: h09
  trap: level-of-detail
  question: What were the top 3 payment types by number of orders in 2017?
  kinds: [key, count]
  sql: |
    select p.payment_type, count(distinct o.order_id)
    from raw.orders o join raw.order_payments p using (order_id)
    where year(o.order_purchase_timestamp) = 2017
    group by 1 order by 2 desc limit 3
  layer: {metrics: [orders_by_payment_type], group_by: [payment__payment_type], start: '2017-01-01', end: '2017-12-31',
          order_by: ['-orders_by_payment_type'], limit: 3}

- id: h10
  trap: level-of-detail
  question: Which product category had the highest freight charges in 2018?
  kinds: [key, money]
  top_row: true
  sql: |
    select coalesce(t.product_category_name_english, p.product_category_name), sum(cast(i.freight_value as decimal(18, 2)))
    from raw.order_items i join raw.orders o using (order_id) join raw.products p using (product_id)
    left join raw.product_category_name_translation t on t.product_category_name = p.product_category_name
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018
    group by 1 order by 2 desc limit 1
  layer: {metrics: [freight], group_by: [product__category], start: '2018-01-01', end: '2018-12-31',
          order_by: ['-freight'], limit: 1}


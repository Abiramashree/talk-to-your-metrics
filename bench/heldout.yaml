# Should decline: no metric answers these honestly. Each names why.

- id: h25
  trap: unanswerable
  question: What was the cancellation rate for each payment type?
  why: an order can have several payment types; no metric splits the cancellation rate that way
  layer_fails: {metrics: [cancellation_rate], group_by: [payment__payment_type]}

- id: h26

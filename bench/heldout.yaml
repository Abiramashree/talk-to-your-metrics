- id: h12
  trap: filter-value
  question: How many delivered orders placed in 2018 got a 5-star review?
  kinds: [count]
  sql: |
    with r as (
      select order_id, review_score from raw.order_reviews
      qualify row_number() over (partition by order_id order by review_answer_timestamp desc) = 1
    )
    select count(*) from raw.orders o join r using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018 and r.review_score = 5
  layer: {metrics: [delivered_orders], start: '2018-01-01', end: '2018-12-31',
          filters: [{dimension: order__review_score, operator: '=', value: 5}]}

- id: h13
  trap: filter-value
  question: For late deliveries on orders placed in 2018, how many days did delivery take on average?
  kinds: [average]
  sql: |
    select avg(date_diff('day', cast(order_purchase_timestamp as date), cast(order_delivered_customer_date as date)))
    from raw.orders
    where order_status = 'delivered' and order_delivered_customer_date is not null
      and cast(order_delivered_customer_date as date) > cast(order_estimated_delivery_date as date)
      and year(order_purchase_timestamp) = 2018
  layer: {metrics: [average_delivery_days], start: '2018-01-01', end: '2018-12-31',
          filters: [{dimension: order__is_late, operator: '=', value: true}]}


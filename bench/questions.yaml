# Benchmark questions. Frozen before the semantic model was written (see README).
# `sql` is the correct answer, written against the raw tables and following definitions.md.
# split: test = scored once per setup; dev = used for tuning prompts and the model.
# trap: the mistake the question is designed to expose.

- id: t01
  split: test
  trap: revenue-definition
  question: What was our total revenue in 2017?
  sql: |
    select sum(cast(i.price as decimal(18, 2))) as revenue
    from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2017

- id: t02
  split: test
  trap: revenue-definition
  question: Show revenue by month for the first half of 2018.
  sql: |
    select date_trunc('month', o.order_purchase_timestamp) as month, sum(cast(i.price as decimal(18, 2))) as revenue
    from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered'
      and o.order_purchase_timestamp >= '2018-01-01' and o.order_purchase_timestamp < '2018-07-01'
    group by 1 order by 1

- id: t03
  split: test
  trap: revenue-definition
  question: Which product category brought in the most revenue in 2018?
  sql: |
    select coalesce(t.product_category_name_english, p.product_category_name) as category, sum(cast(i.price as decimal(18, 2))) as revenue
    from raw.order_items i
    join raw.orders o using (order_id)
    join raw.products p using (product_id)
    left join raw.product_category_name_translation t using (product_category_name)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2018
    group by 1 order by 2 desc limit 1

- id: t04
  split: test
  trap: revenue-definition
  question: What was gross merchandise value, including freight, in 2017?
  sql: |
    select sum(cast(i.price as decimal(18, 2)) + cast(i.freight_value as decimal(18, 2))) as gross_merchandise_value
    from raw.order_items i join raw.orders o using (order_id)
    where o.order_status = 'delivered' and year(o.order_purchase_timestamp) = 2017


- id: t16
  split: test
  trap: late-definition
  question: What was the late delivery rate in 2017?
  sql: |
    select count(*) filter (where cast(order_delivered_customer_date as date) > cast(order_estimated_delivery_date as date))
           / count(*) as late_delivery_rate
    from raw.orders
    where order_status = 'delivered' and order_delivered_customer_date is not null
      and year(order_purchase_timestamp) = 2017

- id: t17
  split: test
  trap: late-definition
  question: What was the late delivery rate for orders from customers in São Paulo state (SP) placed in 2018?
  sql: |
    select count(*) filter (where cast(o.order_delivered_customer_date as date) > cast(o.order_estimated_delivery_date as date))
           / count(*) as late_delivery_rate
    from raw.orders o join raw.customers c using (customer_id)
    where o.order_status = 'delivered' and o.order_delivered_customer_date is not null
      and year(o.order_purchase_timestamp) = 2018 and c.customer_state = 'SP'

- id: t18
  split: test
  trap: late-definition
  question: On average, how many days did delivery take for orders placed in 2018?
  sql: |
    select avg(date_diff('day', cast(order_purchase_timestamp as date), cast(order_delivered_customer_date as date))) as delivery_days
    from raw.orders
    where order_status = 'delivered' and order_delivered_customer_date is not null
      and year(order_purchase_timestamp) = 2018

- id: t19
  split: test
  trap: duplicate-reviews
  question: What was the average review score for orders placed in 2017?
  sql: |
    with r as (
      select order_id, review_score from raw.order_reviews
      qualify row_number() over (partition by order_id order by review_answer_timestamp desc) = 1
    )
    select avg(r.review_score) as average_review_score
    from r join raw.orders o using (order_id)
    where year(o.order_purchase_timestamp) = 2017

- id: t20
  split: test
  trap: duplicate-reviews
  question: How do average review scores compare between late and on-time deliveries?
  sql: |
    with r as (
      select order_id, review_score from raw.order_reviews
      qualify row_number() over (partition by order_id order by review_answer_timestamp desc) = 1
    )
    select cast(o.order_delivered_customer_date as date) > cast(o.order_estimated_delivery_date as date) as is_late,
           avg(r.review_score) as average_review_score
    from r join raw.orders o using (order_id)
    where o.order_status = 'delivered' and o.order_delivered_customer_date is not null
    group by 1 order by 1

- id: t21
  split: test
  trap: duplicate-reviews
  question: How many orders placed in 2018 got a 1-star review?
  sql: |
    with r as (
      select order_id, review_score from raw.order_reviews
      qualify row_number() over (partition by order_id order by review_answer_timestamp desc) = 1
    )
    select count(*) as orders
    from r join raw.orders o using (order_id)
    where r.review_score = 1 and year(o.order_purchase_timestamp) = 2018


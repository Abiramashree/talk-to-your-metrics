- id: t07
  split: test
  trap: customer-identity
  question: How many customers have ordered more than once?
  sql: |
    select count(*) as repeat_customers
    from (
      select c.customer_unique_id
      from raw.orders o join raw.customers c using (customer_id)
      group by 1 having count(*) >= 2
    )

- id: t08
  split: test
  trap: customer-identity
  question: What share of our customers are repeat customers?
  sql: |
    select count(*) filter (where n >= 2) / count(*) as repeat_customer_rate
    from (
      select c.customer_unique_id, count(*) as n
      from raw.orders o join raw.customers c using (customer_id)
      group by 1
    )

- id: t09
  split: test
  trap: customer-identity
  question: How many customers placed at least one order in 2017?
  sql: |
    select count(distinct c.customer_unique_id) as customers
    from raw.orders o join raw.customers c using (customer_id)
    where year(o.order_purchase_timestamp) = 2017

- id: t10
  split: test
  trap: attribute-join
  question: Which state placed the most orders in 2017?
  sql: |
    select c.customer_state as state, count(*) as orders
    from raw.orders o join raw.customers c using (customer_id)
    where year(o.order_purchase_timestamp) = 2017
    group by 1 order by 2 desc limit 1

